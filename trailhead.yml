name: Update Trailhead stats
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i playwright && npx playwright install --with-deps chromium
      - run: node scripts/update-trailhead.mjs
      - run: |
          git config user.name "trailhead-bot"
          git config user.email "bot@users.noreply.github.com"
          git add trailhead.json
          git diff --staged --quiet || (git commit -m "Update Trailhead stats" && git push)